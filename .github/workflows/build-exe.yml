name: Build Windows EXE

# 실행 조건:
#  - main 브랜치에 python 코드가 바뀌면 자동 빌드 → 아티팩트 업로드
#  - 수동 실행(Actions 탭 → Run workflow)
#  - v* 태그를 밀면 릴리스(Release)에 exe 첨부
on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'CHANGELOG.md'          # exe 안에 들어가므로 바뀌면 다시 빌드한다
      - '.github/workflows/build-exe.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '릴리스 태그 (예: v1.1.1). 입력하면 이 태그로 Release 를 만들고 exe 를 첨부. 비우면 빌드만.'
        required: false
        default: ''
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ⚠️ exe 안에 토큰을 넣지 않는다. 릴리스는 누구나 받을 수 있어서, 안에 든
      #    토큰은 꺼내 쓸 수 있다(쓰기 권한이 있으면 가짜 업데이트를 올릴 수 있다).
      #    저장소가 공개라 업데이트 확인에 토큰이 필요 없다.
      #    예전에는 여기서 UPDATE_TOKEN 시크릿을 planner/_secret.py 로 박아 넣었다.
      - name: exe 에 토큰이 들어가지 않았는지 확인
        working-directory: python
        shell: bash
        run: |
          if [ -e planner/_secret.py ]; then
            echo "planner/_secret.py 가 있습니다 — 토큰을 exe 에 넣지 않습니다. 지우고 다시 빌드하세요."
            exit 1
          fi
          echo "토큰 없음 — 정상"

      - name: EXE 빌드 (PyInstaller)
        working-directory: python
        run: pyinstaller planner.spec --noconfirm --clean

      # 아티팩트는 '릴리스를 만들지 않는 빌드' 에서만 올린다.
      # 릴리스 빌드에서는 exe 가 릴리스에 첨부되므로 아티팩트가 중복이고,
      # 매 빌드 52MB 씩 쌓여 저장 용량 한도를 금방 채운다(실제로 한도 초과로
      # 업로드가 실패하면서 릴리스 단계까지 막혔다).
      # 한도에 걸려도 릴리스는 나가야 하므로 continue-on-error 를 둔다.
      - name: 아티팩트 업로드 (릴리스 없는 빌드만)
        if: ${{ !(startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: 일정관리기-windows
          path: python/dist/일정관리기.exe
          if-no-files-found: error
          retention-days: 5

      # 릴리스 본문을 CHANGELOG.md 에서 뽑는다.
      # 예전엔 본문을 안 넣어서 릴리스가 비어 있었고, 앱의 [업데이트 확인] 도
      # 보여 줄 내용이 없었다. 절이 없으면 여기서 실패하므로, 변경 이력에 안 적힌
      # 버전은 배포되지 않는다.
      - name: 릴리스 본문 준비 (CHANGELOG.md 에서)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        # 파일 이름을 넘겨 UTF-8 로 직접 쓰게 한다. `>` 로 받으면 윈도 파이썬이
        # 화면 출력을 cp1252 로 잡아 한글 ■ 에서 죽는다(v1.12.0 이 이걸로 실패했다).
        run: python tools/extract_release_notes.py "${{ inputs.release_tag || github.ref_name }}" RELEASE_NOTES.md

      - name: 릴리스 배포 (태그 push / release / 수동입력 태그)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: python/dist/일정관리기.exe
