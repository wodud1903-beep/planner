name: Build 업무자료검색 EXE

# 업무자료검색(kbsearch/) 전용 빌드 — 일정관리기 빌드(build-exe.yml)와 따로 돈다.
#
# **판 번호를 올려 push 하면 저절로 릴리스한다.** (따로 태그를 밀 필요 없음)
#  - kbsearch/ 가 바뀐 push 마다 검사 + 빌드.
#  - kbsearch/kbsearch/config.py 의 APP_VERSION 이 아직 안 나간 새 판이면(kb-vX.Y.Z 태그가
#    없고 지금까지 나간 판보다 높으면) 그 태그로 릴리스를 만들고 exe 를 붙인다
#    → 모든 PC 가 그 판으로 자동 업데이트(kbsearch/release_plan.py).
#  - 판 번호가 그대로면 빌드만 하고 아티팩트(업무자료검색-windows)로 올린다.
#  - kb-v* 태그를 직접 밀거나, 수동 실행에 태그를 넣어도 된다(예전 방식).
#
# ⚠️ 릴리스는 make_latest: false 로 낸다. 일정관리기 업데이트는 releases/latest 를 보므로
#    이 릴리스가 '최신' 이 되면 일정관리기 PC 들이 자기 새 판을 못 찾는다.
# ⚠️ 태그의 판 번호와 APP_VERSION 이 다르면 멈춘다. 다르게 나가면 받은 PC 가 '아직 옛 판'
#    이라 여겨 업데이트를 끝없이 되풀이한다.
# ⚠️ 새 판인데 kbsearch/CHANGELOG.md 에 그 절이 없으면 멈춘다(업데이트 창이 그 절을 보여 준다).
on:
  push:
    branches: ['**']
    paths:
      - 'kbsearch/**'
      - '.github/workflows/build-kbsearch.yml'
    tags:
      - 'kb-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '릴리스 태그 (예: kb-v1.0.1). 비우면 APP_VERSION 이 새 판일 때만 저절로 릴리스.'
        required: false
        default: ''

permissions:
  contents: write

# 릴리스가 겹치지 않게 한 줄로 세운다 — 바로 이어 민 두 push 가 같은 판을 두 번 내지 않게.
# (뒤의 것은 앞의 것이 만든 태그를 보고 빌드만 한다)
concurrency:
  group: kbsearch-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 릴리스할지 정하기
        id: plan
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/kb-v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tags=$(git ls-remote --tags origin 'kb-v*')
            tag=$(printf '%s\n' "$tags" | python kbsearch/release_plan.py)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "릴리스: ${tag:-없음 (판 번호가 그대로라 빌드만)}"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r kbsearch/requirements.txt
          pip install pyinstaller

      - name: 태그와 프로그램 판 번호가 같은지 확인 (릴리스 때만)
        if: steps.plan.outputs.tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            kb-v*) ;;
            *) echo "태그는 kb-v 로 시작해야 합니다: $RELEASE_TAG"; exit 1 ;;
          esac
          want="${RELEASE_TAG#kb-v}"
          have=$(python -c "import re,pathlib;print(re.search(r'APP_VERSION = \"([^\"]+)\"', pathlib.Path('kbsearch/kbsearch/config.py').read_text(encoding='utf-8')).group(1))")
          echo "태그 $want / APP_VERSION $have"
          if [ "$want" != "$have" ]; then
            echo "판 번호가 다릅니다 — config.py 의 APP_VERSION 을 $want 로 바꾼 뒤 다시 하세요."
            exit 1
          fi

      - name: 검사
        working-directory: kbsearch
        run: python verify/run_all.py

      - name: EXE 빌드 (PyInstaller)
        working-directory: kbsearch
        run: pyinstaller kbsearch.spec --noconfirm --clean

      - name: 아티팩트 업로드 (릴리스 없는 빌드만)
        if: steps.plan.outputs.tag == ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: 업무자료검색-windows
          path: kbsearch/dist/업무자료검색.exe
          if-no-files-found: error
          retention-days: 5

      - name: 릴리스 본문 준비 (kbsearch/CHANGELOG.md 에서)
        if: steps.plan.outputs.tag != ''
        run: python kbsearch/release_notes.py "${{ steps.plan.outputs.tag }}" RELEASE_NOTES.md

      - name: 릴리스 배포
        if: steps.plan.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 업무자료검색 ${{ steps.plan.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: kbsearch/dist/업무자료검색.exe
          make_latest: 'false'
