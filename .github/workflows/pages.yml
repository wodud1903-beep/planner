name: Deploy PWA to Pages

# 폰에서 쓰는 웹앱(web/)을 GitHub Pages 로 올린다.
#  - web/ 이나 CHANGELOG.md 가 바뀌면 자동
#  - 수동 실행도 가능
# exe 빌드(build-exe.yml)는 paths 가 'python/**' 허용목록이라 여기에 안 걸린다.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
      - 'tools/build_web.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ⚠️ cancel-in-progress 를 켜지 않는다.
#    배포 도중에 취소되면 옛 파일과 새 파일이 섞인 사이트가 나갈 수 있고,
#    그 상태의 서비스워커는 반쯤 갱신된 앱을 손님에게 보여준다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 올릴 폴더 만들기 (Vercel 과 같은 스크립트)
        run: bash tools/build_web.sh _site "$GITHUB_SHA"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
