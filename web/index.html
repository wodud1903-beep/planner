<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 구글 Search Console 소유 확인(OAuth 브랜딩 인증용) — 지우면 확인이 풀린다 -->
<meta name="google-site-verification" content="Qy8fjefQJ_EXXouPn4P2OJse4bdgVRnaeaNuvlbELFA">
<script>
  // 고른 테마를 화면이 그려지기 전에 넣는다(안 넣으면 한 번 번쩍인다). js/theme.js 와 같은 키.
  try { var t = localStorage.getItem("planner.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일정관리기</title>
<meta name="theme-color" content="#fbfbfe">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
<!-- 구글 API 에 미리 길을 터 둔다(첫 자료가 0.1~0.3초 빨리 온다) -->
<link rel="preconnect" href="https://www.googleapis.com" crossorigin>
<link rel="preconnect" href="https://sheets.googleapis.com" crossorigin>
<link rel="preconnect" href="https://tasks.googleapis.com" crossorigin>
<!--MODULEPRELOAD-->
</head>
<body>
<div id="app"></div>
<script type="module" src="./js/boot.js"></script>
</body>
</html>
